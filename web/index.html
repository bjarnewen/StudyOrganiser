<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Study Organiser</title>
<meta name="description" content="Your timetable, assignments and class notes, synced across Mac and iPad." />

<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

<!-- Home Screen install on iPadOS/iOS -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Study Organiser" />
<link rel="apple-touch-icon" href="./icons/icon-180.png" />
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />

<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="app-title">Study Organiser</h1>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Sections"></nav>
    </aside>

    <main class="main">
      <div class="scroller">
        <div id="content"></div>
      </div>
    </main>
  </div>

  <nav id="tab-bar" class="tab-bar" aria-label="Sections"></nav>

  <noscript>
    <p style="padding:2rem;font:16px/1.5 -apple-system,system-ui,sans-serif">
      Study Organiser needs JavaScript to run. Please enable it and reload.
    </p>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
